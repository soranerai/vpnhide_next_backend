name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-native:
    name: Build Rust native library (via Gradle + Gobley)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/soranerai/vpnhide_next/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            lsposed/native/target
          key: cargo-${{ runner.os }}-native-${{ hashFiles('lsposed/native/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-native-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create debug keystore for signing
        run: |
          mkdir -p /root/.android
          keytool -genkey -v \
            -keystore /root/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug, O=Debug, C=US"

      - name: Build native lib via Gradle (Gobley cargo plugin, RELEASE)
        run: |
          cd lsposed
          # assembleRelease compiles with Rust release profile (LTO, opt-level=z, strip=true)
          # Debug profile would skip all obfuscation optimizations
          ./gradlew :app:assembleRelease

      - name: Copy .so to artifacts
        run: |
          mkdir -p artifacts
          # Find release .so from Gradle or cargo release target
          find lsposed -path '*/release/*' -name 'libvpnhide_checks.so' -type f ! -path '*/deps/*' | head -1 | xargs cp -t artifacts/
          ls -lh artifacts/libvpnhide_checks.so

      - name: Upload .so as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvpnhide_checks.so
          path: artifacts/libvpnhide_checks.so
          retention-days: 30
          if-no-files-found: error

  build-kmod:
    name: Build kernel module (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    # DDK image from public ylarod — doesn't depend on our repo
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
    steps:
      - uses: actions/checkout@v6

      - name: Build host binaries (ctl, daemon)
        run: |
          cd kmod
          gcc -O2 -Wall -static vpnhide_ctl.c parson.c -o vpnhide-ctl
          gcc -O2 -Wall -static vpnhide_daemon.c -o vpnhide-daemon
          llvm-strip vpnhide-ctl vpnhide-daemon
          # Place in module root for inclusion in zip
          cp vpnhide-ctl vpnhide-daemon module/

      - name: Build kernel module
        run: |
          cd kmod
          python3 build.py --kmi ${{ matrix.kmi }} --inside-container

      - name: Upload module zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnhide-kmod-${{ matrix.kmi }}
          path: vpnhide-kmod-${{ matrix.kmi }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-native, build-kmod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/libvpnhide_checks.so/libvpnhide_checks.so
            dist/vpnhide-kmod-*/vpnhide-kmod-*.zip
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
